<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#140C12">
  <title>Un cuento de viaje</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #140C12;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #juego {
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    canvas { touch-action: none; display: block; }
  </style>
</head>
<body>
  <div id="juego"></div>

  <script>
    // Bloquea gestos de zoom en iOS (pinch y doble toque) y el menú contextual.
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
      document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
    });
    document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
    document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    // Si algo falla al cargar, se muestra en pantalla en vez de quedar en negro.
    function avisoCarga(texto) {
      var d = document.getElementById('aviso-carga');
      if (!d) {
        d = document.createElement('div');
        d.id = 'aviso-carga';
        d.style.cssText = 'position:fixed;left:16px;right:16px;bottom:24px;z-index:9;padding:12px 14px;border-radius:12px;' +
          'background:#FBF3E2;color:#2A1B23;font:14px/1.4 Nunito,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.4)';
        document.body.appendChild(d);
      }
      d.textContent = texto;
    }
    window.addEventListener('error', function (e) {
      if (window.errorCarga) return; // se muestra el primer error, que suele ser la causa
      window.errorCarga = true;
      avisoCarga('No se pudo cargar el juego: ' + (e.message || (e.target && (e.target.src || e.target.href)) || 'error desconocido') + '. Recarga la página.');
    }, true);
    setTimeout(function () {
      if (!window.juego || !window.juego.scene.getScenes(true).some(function (s) { return s.scene.key !== 'Boot' && s.scene.key !== 'HUD'; })) {
        avisoCarga('El juego está tardando en cargar. Si no aparece en unos segundos, recarga la página.');
      }
    }, 25000);
  </script>
  <script src="vendor/phaser.min.js"></script>
  <script src="config.js"></script>
  <script src="arte.js"></script>
  <script src="game.js"></script>
</body>
</html>
